# OPS-01: the whole production stack on one server. Run from the repo root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env.production up -d
name: crm

services:
  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.client
    image: ghcr.io/${IMAGE_REPO}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
    logging: &logging
      driver: json-file
      options:
        max-size: "50m"
        max-file: "14"

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: ghcr.io/${IMAGE_REPO}-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGO_URL: mongodb://crm_app:${MONGO_APP_PASSWORD}@mongo:27017/crm?replicaSet=rs0&authSource=crm
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    expose:
      - "4000"
    depends_on:
      mongo:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  mongo:
    image: mongo:7
    restart: unless-stopped
    # OPS-03: no published port. Only the Docker network can reach it. Auth is on.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--auth", "--keyFile", "/run/secrets/mongo-keyfile"]
    volumes:
      - mongo_data:/data/db
      - ./mongo-keyfile:/run/secrets/mongo-keyfile:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  clamav:
    # OPS-01: clamd with signature updates (freshclam runs in the image).
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  mongo_data:
  clamav_db:
