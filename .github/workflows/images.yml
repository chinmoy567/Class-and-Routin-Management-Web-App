name: Build images

# OPS-06: a merge to main builds the images. Deploying is a separate manual step (docs/deploy.md).
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-server:${{ github.sha }}
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.client
          push: true
          tags: ghcr.io/${{ github.repository }}-web:${{ github.sha }}
